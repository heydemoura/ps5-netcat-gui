<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--acc:#39ff9f;--acc2:#7c5cff;--acc3:#00d4ff;--mut:#7d8796;--line:rgba(120,255,190,.14);--mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif}
body{width:1200px;height:630px;overflow:hidden;background:#05060a;color:#e6edf3;font-family:var(--sans);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 40% 40%,#000 30%,transparent 80%)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 15% 10%,rgba(124,92,255,.35),transparent 40%),radial-gradient(circle at 90% 20%,rgba(57,255,159,.22),transparent 40%),radial-gradient(circle at 60% 110%,rgba(0,212,255,.2),transparent 45%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.logo{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-weight:800;font-size:26px;letter-spacing:.08em}
.logo i{width:18px;height:18px;border-radius:4px;background:var(--acc);box-shadow:0 0 20px var(--acc)}
.tag{margin-top:46px;align-self:flex-start;font-family:var(--mono);font-size:19px;letter-spacing:.2em;color:var(--acc);border:1px solid rgba(57,255,159,.4);background:rgba(57,255,159,.07);padding:8px 18px;border-radius:999px}
h1{margin-top:26px;font-size:112px;line-height:.95;letter-spacing:-.035em;font-weight:700}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc3) 50%,var(--acc2));-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(57,255,159,.3))}
.cur{display:inline-block;width:.48em;height:.8em;background:var(--acc);vertical-align:-.04em;margin-left:10px;box-shadow:0 0 24px var(--acc)}
.sub{margin-top:26px;font-size:30px;color:#aab3c0;max-width:760px;line-height:1.3}
.sub b{color:#e6edf3;font-weight:500}
.term{position:absolute;right:64px;bottom:60px;width:430px;font-family:var(--mono);font-size:17px;line-height:1.7;background:rgba(2,3,4,.85);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:0 0 50px rgba(57,255,159,.12)}
.dots{display:flex;gap:7px;margin-bottom:10px}.dots i{width:12px;height:12px;border-radius:50%}
.p{color:var(--acc)}.o{color:var(--acc3)}.m{color:var(--mut)}
.url{position:absolute;left:72px;bottom:60px;font-family:var(--mono);font-size:22px;color:var(--mut)}.url b{color:var(--acc)}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="logo"><i></i>PAYLOAD//SEND</div>
  <div class="tag">◆ PS5 ELF LOADER · NO RELAY</div>
  <h1>Ship your <span class="grad">payload</span><span class="cur"></span></h1>
  <p class="sub">Send <b>.elf</b> payloads to your PS5 <b>straight from the browser</b>. No relay, no install.</p>
</div>
<div class="term"><div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
<span class="p">$ send ftpsrv.elf → :9021</span><br><span class="m">connected, PS5 fetching…</span><br><span class="o">elfldr accepted it ✓</span></div>
<div class="url"><b>▸</b> sendpayload.pages.dev</div>
<div class="scan"></div>
</body></html>
